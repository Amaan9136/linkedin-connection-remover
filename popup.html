<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Connection Remover</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="2" y="9" width="4" height="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="4" cy="4" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="title">Connection Remover</span>
    </div>
    <div class="status" id="status">
      <div class="status-icon" id="statusIcon">●</div>
      <span id="statusText">Checking page...</span>
    </div>
    <div class="actions" id="actions" style="display:none">
      <button class="btn btn-primary" id="togglePanel">Open Selection Panel</button>
    </div>
    <div class="not-linkedin" id="notLinkedIn" style="display:none">
      <p>Navigate to your <a href="https://www.linkedin.com/mynetwork/invite-connect/connections/" target="_blank">LinkedIn Connections</a> page to use this extension.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
